<!doctype html>
<html lang="en" class="scroll-smooth" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/aurora-tokens.css" />
    <meta name="theme-color" content="#0B0B1A" />
    <link rel="preload" as="image" href="/src/assets/images/profile.webp" type="image/webp" />

    <!-- Google Fonts: Inter (Sans) and JetBrains Mono (Code/Accents) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <script>
      (() => {
        const root = document.documentElement;
        let savedTheme = null;
        try {
          savedTheme = localStorage.getItem('aurora-theme');
        } catch {
          savedTheme = null;
        }
        const theme = savedTheme === 'light' ? 'light' : 'night';
        root.dataset.theme = theme;
        const background = theme === 'light' ? '#FAF8FF' : '#05060A';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', background);
      })();
    </script>
    
    <!-- Primary Meta Tags -->
    <title>Abhijeet Singh | Software Developer &amp; AI/ML Enthusiast</title>
    <meta name="title" content="Abhijeet Singh | Software Developer &amp; AI/ML Enthusiast" />
    <meta
      name="description"
      content="Portfolio of Abhijeet Singh, a Computer Science undergraduate focused on software engineering, AI/ML, backend systems, and full-stack development."
    />
    <meta name="author" content="Abhijeet Singh" />
    <link rel="canonical" href="https://abhijeetsingh.dev/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://abhijeetsingh.dev/" />
    <meta property="og:title" content="Abhijeet Singh | Software Developer &amp; AI/ML Enthusiast" />
    <meta
      property="og:description"
      content="Portfolio of Abhijeet Singh, a Computer Science undergraduate focused on software engineering, AI/ML, backend systems, and full-stack development."
    />
    <meta property="og:image" content="/og-preview.svg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://abhijeetsingh.dev/" />
    <meta property="twitter:title" content="Abhijeet Singh | Software Developer &amp; AI/ML Enthusiast" />
    <meta
      property="twitter:description"
      content="Portfolio of Abhijeet Singh, a Computer Science undergraduate focused on software engineering, AI/ML, backend systems, and full-stack development."
    />
    <meta property="twitter:image" content="/og-preview.svg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Abhijeet Singh",
        "url": "https://abhijeetsingh.dev/",
        "jobTitle": "Software Developer & AI/ML Enthusiast",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Lucknow",
          "addressCountry": "IN"
        },
        "alumniOf": {
          "@type": "EducationalOrganization",
          "name": "Pranveer Singh Institute of Technology"
        },
        "sameAs": [
          "https://github.com/Abhijeet-Singh-01",
          "https://www.linkedin.com/in/abhijeet-singh-988276330/",
          "https://leetcode.com/u/1_abhi/"
        ]
      }
    </script>
  </head>
  <body class="bg-bg text-text font-sans antialiased selection:bg-accent-indigo/25 selection:text-text overflow-x-hidden min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
