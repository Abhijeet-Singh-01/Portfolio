<?xml-stylesheet type="text/css" href="/aurora-tokens.css"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Dark Charcoal Base -->
  <rect width="1200" height="630" fill="var(--surface)" />

  <!-- Warm Olive/Gold Glow (Left) -->
  <circle cx="200" cy="180" r="380" fill="url(#goldGradient)" opacity="0.3" filter="blur(80px)" />

  <!-- Cool Teal Glow (Right) -->
  <circle cx="1050" cy="450" r="420" fill="url(#tealGradient)" opacity="0.25" filter="blur(90px)" />

  <!-- Border Frame -->
  <rect x="30" y="30" width="1140" height="570" rx="16" stroke="var(--border)" stroke-width="1.5" />
  <rect x="34" y="34" width="1132" height="562" rx="12" stroke="var(--accent-indigo-glow)" stroke-width="1" />

  <!-- Monogram Box -->
  <rect x="90" y="90" width="70" height="70" rx="12" fill="var(--surface)" stroke="var(--accent-indigo-glow)" stroke-width="1.5" />
  <text x="125" y="136" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="bold" fill="var(--text)" text-anchor="middle">AS</text>

  <!-- Status Badge -->
  <rect x="180" y="105" width="260" height="38" rx="19" fill="var(--surface)" stroke="var(--accent-indigo-glow)" stroke-width="1" />
  <circle cx="204" cy="124" r="5" fill="var(--accent-aqua)" />
  <text x="222" y="129" font-family="monospace" font-size="12" font-weight="600" fill="var(--accent-indigo-ink)" letter-spacing="2">AVAILABLE FOR OPPORTUNITIES</text>

  <!-- Editorial Main Heading -->
  <text x="90" y="270" font-family="Georgia, serif" font-size="76" font-weight="normal" fill="var(--text)">
    Hey, I'm <tspan fill="var(--accent-indigo-ink)" font-style="italic">Abhijeet.</tspan>
  </text>

  <!-- Positioning Subtitle -->
  <text x="90" y="340" font-family="monospace" font-size="22" font-weight="500" fill="var(--text-2)" letter-spacing="1">
    Computer Science Undergraduate • Backend & Full-Stack Engineering
  </text>

  <!-- Summary Description -->
  <text x="90" y="405" font-family="sans-serif" font-size="20" fill="var(--text-2)">
    Seeking software development opportunities in backend and full-stack engineering.
  </text>
  <text x="90" y="440" font-family="sans-serif" font-size="20" fill="var(--text-2)">
    Scalable APIs • Database-driven applications • AI-powered solutions
  </text>

  <!-- Bottom Badges / Tech Highlights -->
  <g transform="translate(90, 495)">
    <rect x="0" y="0" width="180" height="38" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
    <text x="90" y="24" font-family="monospace" font-size="13" fill="var(--accent-indigo-ink)" text-anchor="middle">AI INCIDENT INTEL</text>

    <rect x="200" y="0" width="130" height="38" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
    <text x="265" y="24" font-family="monospace" font-size="13" fill="var(--accent-aqua)" text-anchor="middle">SOLISIQ</text>

    <rect x="350" y="0" width="140" height="38" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
    <text x="420" y="24" font-family="monospace" font-size="13" fill="var(--accent-indigo-ink)" text-anchor="middle">INSTANEWS</text>

    <rect x="510" y="0" width="180" height="38" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1" />
    <text x="600" y="24" font-family="monospace" font-size="13" fill="var(--accent-aqua)" text-anchor="middle">ZEROHOUR</text>
  </g>

  <!-- Location Indicator (Right Bottom) -->
  <text x="1100" y="530" font-family="monospace" font-size="14" fill="var(--text-2)" text-anchor="end">
    Lucknow, India • 2026 Portfolio
  </text>

  <defs>
    <radialGradient id="goldGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--accent-indigo)" />
      <stop offset="100%" stop-color="var(--surface)" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="tealGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="var(--accent-aqua)" />
      <stop offset="100%" stop-color="var(--surface)" stop-opacity="0" />
    </radialGradient>
  </defs>
</svg>
